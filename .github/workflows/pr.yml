name: TC-Bot PR Checks

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 26

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@f50565632710173b0e366f2cd39b928d31362815 # v1.6.0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true

      - name: Run quality checks
        run: pnpm run validate

      - name: Build project
        run: pnpm run build
